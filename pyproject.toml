[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edit-outcome"
version = "1.0.0"
description = "Held-out calibration for base and prime editor outcome shares."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Choppa Devasai Pranatheswar" }]
dependencies = []

[project.scripts]
edit-outcome = "edit_outcome.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
